[project]
name = "vigilia"
version = "0.1.0"
description = "Durable operational incident investigations with auditable evidence"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18.5",
    "confluent-kafka>=2.15.0",
    "fastapi[standard]>=0.137.2",
    "pydantic-settings>=2.12.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy[asyncio]>=2.0.48",
    "litellm>=1.100.1",
    "pgvector>=0.4.1",
]

[project.scripts]
vigilia = "vigilia.main:run"
vigilia-worker = "vigilia.worker:run"
vigilia-publisher = "vigilia.publisher:run"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vigilia.adapters.http" = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
