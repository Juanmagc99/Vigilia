# Merge with docker-compose.yaml; Makefile supplies both files.
x-dev: &dev
  image: vigilia:dev
  environment:
    VIGILIA_ENVIRONMENT: docker-dev
  volumes:
    - ../src:/app/src:ro
    - ../migrations:/app/migrations:ro
    - ../alembic.ini:/app/alembic.ini:ro

services:
  api:
    <<: *dev
    command: ["uvicorn", "vigilia.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  worker:
    <<: *dev
  outbox-publisher:
    <<: *dev
  migrate:
    <<: *dev
